name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ vars.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_DATABASE_ID }}
          NEXT_PUBLIC_APPWRITE_RSVP_COLLECTION_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_RSVP_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_WISHES_COLLECTION_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_WISHES_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_GALLERY_COLLECTION_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_GALLERY_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_GALLERY_BUCKET_ID: ${{ vars.NEXT_PUBLIC_APPWRITE_GALLERY_BUCKET_ID }}
          NEXT_PUBLIC_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NEXT_PUBLIC_BASE_PATH: /invitacion-vickey
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
